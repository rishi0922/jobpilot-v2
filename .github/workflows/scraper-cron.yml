name: JobPilot Scraper — scheduled run

on:
  schedule:
    # Every 3 hours, 7am–10pm IST (1:30am–4:30pm UTC)
    - cron: '30 1 * * *'
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  trigger-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JobPilot scraper
        run: |
          curl -X POST "${{ secrets.NEXT_APP_URL }}/api/scraper/trigger" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.SCRAPER_API_KEY }}" \
            --fail \
            --silent \
            --show-error

      - name: Log result
        run: echo "Scraper triggered at $(date)"
